<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cataclysm: Fault Lines</title>
    <style>
        body { margin: 0; background: #151515; color: #eee; font: 1rem system-ui; }
        main { display: grid; min-height: 100vh; place-content: center; }
        canvas { display: block; max-width: 100vw; max-height: 100vh; object-fit: contain; }
        #status { text-align: center; }
    </style>
</head>
<body>
    <main>
        <p id="status" role="status">Loading Cataclysm…</p>
        <canvas id="canvas" aria-label="Cataclysm: Fault Lines" tabindex="0"></canvas>
    </main>
    <script>
        const statusElement = document.querySelector("#status");
        const canvas = document.querySelector("#canvas");
        canvas.addEventListener("contextmenu", (event) => event.preventDefault());
        canvas.addEventListener("pointerdown", () => canvas.focus());

        var Module = {
            canvas,
            setStatus(message) {
                statusElement.textContent = message || "Starting Cataclysm…";
            },
            onRuntimeInitialized() {
                statusElement.hidden = true;
                canvas.focus();
            },
            onAbort(reason) {
                statusElement.hidden = false;
                statusElement.textContent = `Cataclysm stopped: ${reason}`;
            }
        };
    </script>
    {{{ SCRIPT }}}
</body>
</html>
