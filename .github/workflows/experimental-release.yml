name: "Experimental Release"

concurrency: experimental-release

permissions:
  contents: write

on:
  push:
    branches:
      - main
    paths-ignore: [docs/**, scripts/**, "**.md", "**.mdx"]

jobs:
  metadata:
    uses: ./.github/workflows/registry-mods-summary.yml

  builds:
    uses: ./.github/workflows/build.yml
    with:
      version-label: experimental
      upload-to-release: true
      release-tag: experimental
    secrets: inherit
