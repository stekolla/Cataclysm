name: WebAssembly Build

on:
  workflow_call:
    inputs:
      version-label:
        description: Label used for the generated web archive
        required: true
        type: string
      artifact-label:
        description: Optional suffix for the uploaded workflow artifact
        required: false
        type: string
        default: ""
      checkout-ref:
        description: Git ref or SHA to build
        required: false
        type: string
        default: ""
      upload-to-release:
        description: Upload the browser archive to a GitHub release
        required: false
        type: boolean
        default: false
      release-tag:
        description: Release tag to upload to
        required: false
        type: string
        default: ""
      upload-artifacts:
        description: Upload the browser archive as a workflow artifact
        required: false
        type: boolean
        default: false
      run-native-tests:
        description: Run the Linux test-only suite before the Wasm build
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  wasm:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ inputs.checkout-ref }}

      - name: Build shared Linux build and test image
        run: docker build --tag cataclysm-bn-build-env:emsdk-6.0.8 --file docker/Dockerfile docker/

      - name: Check build directory isolation
        run: bash build-scripts/test-run-docker.sh

      - name: Check Docker interruption
        run: python3 build-scripts/test-docker-signals.py

      - name: Run native test-only suite
        if: inputs.run-native-tests
        run: ./test fast

      - name: Configure and build browser game and tests
        run: ./test wasm

      - name: Package browser build
        run: |
          archive="cataclysm-web-${{ inputs.version-label }}.zip"
          cd out/docker-build/wasm-tests/web
          zip -qr "${GITHUB_WORKSPACE}/${archive}" . -x 'cata_test-tiles*'
          echo "archive=${archive}" >> "$GITHUB_OUTPUT"
        id: package

      - name: Upload workflow artifact
        if: inputs.upload-artifacts
        uses: actions/upload-artifact@v6
        with:
          name: wasm-web-${{ inputs.artifact-label || inputs.version-label }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error

      - name: Upload browser build to release
        if: inputs.upload-to-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.release-tag }}" "${{ steps.package.outputs.archive }}" --clobber
