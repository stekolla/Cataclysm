name: WebAssembly CI

on:
  push:
    branches: [main]
    paths-ignore: [docs/**, "**.md", "**.mdx"]
  pull_request:
    branches: [main]
    paths-ignore: [docs/**, "**.md", "**.mdx"]
    types: [opened, reopened, synchronize]
  workflow_dispatch:

concurrency:
  group: wasm-ci-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      version-label: ci-${{ github.sha }}
      artifact-label: ${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}
      upload-artifacts: true
      run-native-tests: true
